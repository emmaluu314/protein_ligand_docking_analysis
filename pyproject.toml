[project]
name = "protein-ligand-docking-analysis"
version = "0.1.0"
description = ""
authors = [
    {name = "emmaluu314",email = "emluu@ucdavis.edu"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=2.2.3,<3.0.0)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "scipy (>=1.16.2,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "biopandas (>=0.5.1,<0.6.0)"
]


[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This project is a collection of scripts (no importable package directory),
# so ship the top-level scripts and helper folders explicitly.
packages = []
include = [
    "*.py",
    "compare_to_reference/**/*",
    "filtering/**/*",
    "plotting_functions/**/*",
    "custom_analyses/**/*",
]
